name: "Combo Sheet"
description: "Compartir un combo con la comunidad"
title: "[COMBO] "
labels: ["combo", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por compartir un combo. En la app, arma tu combo y pulsa el botón de **compartir enlace** (🔗); luego pega ese enlace abajo.
  - type: input
    id: title
    attributes:
      label: Título del combo
      placeholder: "Salamangreat Gazelle 1-Card Starter"
    validations:
      required: true
  - type: input
    id: archetype
    attributes:
      label: Arquetipo(s)
      placeholder: "Salamangreat, Code Talker"
  - type: input
    id: tags
    attributes:
      label: Etiquetas
      description: "Separadas por coma."
      placeholder: "1 carta, principiante, OTK"
  - type: textarea
    id: link
    attributes:
      label: Enlace del combo
      description: "Pega aquí el enlace que copia la app con el botón de compartir."
      placeholder: "https://aaoollaaooll.github.io/Yugioh-combo-maker/?combo=..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notas (opcional)
      placeholder: "Qué necesita, contra qué es débil, video de referencia…"
